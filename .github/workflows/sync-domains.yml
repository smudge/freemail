name: Sync domains

on:
  workflow_dispatch:
  schedule:
    - cron: '18 7 * * 1'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash bin/sync-domains
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake spec
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            data/free.txt
            data/disposable.txt
          branch: chore/update-domains
          delete-branch: true
          commit-message: Sync domain lists
          title: Sync domain lists
          body: Synced from npm freemail's sources.
