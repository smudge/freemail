name: Test

on:
  push:
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  package:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.3', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Build and install gem
        run: |
          gem build freemail.gemspec
          gem install --local freemail-*.gem --install-dir "$RUNNER_TEMP/freemail-gems" --no-document
      - name: Check installed gem
        env:
          GEM_HOME: ${{ runner.temp }}/freemail-gems
          GEM_PATH: ${{ runner.temp }}/freemail-gems
        run: |
          cd "$RUNNER_TEMP"
          ruby -e "require 'freemail'; abort unless Freemail.free?('test@gmail.com') && Freemail.disposable?('test@10minutemail.com')"
